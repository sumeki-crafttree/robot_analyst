output_artifacts:
  - artifact_name: "document_canonical_json"
    format: "json"
    encoding: "utf-8"
    path_pattern: "{yyyymmdd}/documents/{document_id}/semiconductor_macro_event_extraction.json"
    grain: "one_file_per_processed_document"
    description: "Canonical document result with zero or more events. Runtime failures create no canonical file."
  - artifact_name: "daily_event_jsonl"
    format: "jsonl"
    encoding: "utf-8"
    path_pattern: "{yyyymmdd}/semiconductor_macro_events.jsonl"
    grain: "one_row_per_event"
    canonical_projection: true
    projection_shape:
      description: "Each line is a lossless envelope projected from one canonical document event; documents with no events produce zero lines."
      schema_ref: "event_jsonl_envelope"
      native_json_rule: "Arrays and objects remain native JSON values; they are not stringified inside JSONL."
  - artifact_name: "daily_event_csv"
    format: "csv"
    encoding: "utf-8-sig"
    path_pattern: "{yyyymmdd}/semiconductor_macro_events.csv"
    grain: "one_row_per_event"
    canonical_projection: true
  - artifact_name: "daily_summary_csv"
    format: "csv"
    encoding: "utf-8-sig"
    path_pattern: "{yyyymmdd}/semiconductor_macro_event_extraction_summary.csv"
    grain: "one_row_per_input_document"
  - artifact_name: "daily_failed_csv"
    format: "csv"
    encoding: "utf-8-sig"
    path_pattern: "{yyyymmdd}/semiconductor_macro_event_extraction_failed.csv"
    grain: "one_row_per_failure"
  - artifact_name: "daily_review_queue_csv"
    format: "csv"
    encoding: "utf-8-sig"
    path_pattern: "{yyyymmdd}/semiconductor_macro_event_review_queue.csv"
    grain: "one_row_per_review_item"
  - artifact_name: "daily_report_json"
    format: "json"
    encoding: "utf-8"
    path_pattern: "{yyyymmdd}/daily_semiconductor_macro_event_extraction_report.json"
    grain: "one_file_per_day"
  - artifact_name: "all_event_jsonl"
    format: "jsonl"
    encoding: "utf-8"
    path_pattern: "semiconductor_macro_events_all.jsonl"
    grain: "one_row_per_event_in_run"
    canonical_projection: true
    projection_shape:
      description: "Each line is a lossless envelope projected from one canonical document event; documents with no events produce zero lines."
      schema_ref: "event_jsonl_envelope"
      native_json_rule: "Arrays and objects remain native JSON values; they are not stringified inside JSONL."
  - artifact_name: "all_event_csv"
    format: "csv"
    encoding: "utf-8-sig"
    path_pattern: "semiconductor_macro_events_all.csv"
    grain: "one_row_per_event_in_run"
  - artifact_name: "all_summary_csv"
    format: "csv"
    encoding: "utf-8-sig"
    path_pattern: "semiconductor_macro_event_extraction_summary_all.csv"
    grain: "one_row_per_input_document_in_run"
  - artifact_name: "all_failed_csv"
    format: "csv"
    encoding: "utf-8-sig"
    path_pattern: "semiconductor_macro_event_extraction_failed_all.csv"
    grain: "one_row_per_failure_in_run"
  - artifact_name: "all_review_queue_csv"
    format: "csv"
    encoding: "utf-8-sig"
    path_pattern: "semiconductor_macro_event_review_queue_all.csv"
    grain: "one_row_per_review_item_in_run"
  - artifact_name: "all_report_json"
    format: "json"
    encoding: "utf-8"
    path_pattern: "semiconductor_macro_event_extraction_report_all.json"
    grain: "one_file_per_run"

canonical_document:
  object_name: "semiconductor_macro_event_extraction"
  primary_key: ["document_id"]
  required_properties:
    - "schema_version"
    - "extraction_version"
    - "taxonomy_version"
    - "document_id"
    - "source_metadata"
    - "input_versions"
    - "extraction_provenance"
    - "extraction_status"
    - "events"
    - "warnings"
    - "validation"
    - "generated_at_utc"
  properties:
    schema_version: {logical_type: "string", nullable: false, expected_value: "1.0.0"}
    extraction_version: {logical_type: "string", nullable: false}
    taxonomy_version: {logical_type: "string", nullable: false, expected_value: "1.0.0"}
    document_id: {logical_type: "string", nullable: false}
    source_metadata:
      logical_type: "json_object"
      nullable: false
      schema_ref: "source_metadata"
    input_versions:
      logical_type: "json_object"
      nullable: false
      schema_ref: "input_versions"
    extraction_provenance:
      logical_type: "json_object"
      nullable: false
      schema_ref: "extraction_provenance"
    extraction_status:
      logical_type: "enum"
      nullable: false
      enum_ref: "extraction_status"
    events:
      logical_type: "json_array"
      nullable: false
      item_schema_ref: "macro_event"
    warnings:
      logical_type: "json_array"
      nullable: false
      item_schema_ref: "warning"
    validation:
      logical_type: "json_object"
      nullable: false
      schema_ref: "validation_result"
    generated_at_utc: {logical_type: "utc_datetime_string", nullable: false}

objects:
  event_jsonl_envelope:
    required_properties:
      - "schema_version"
      - "extraction_version"
      - "taxonomy_version"
      - "document_id"
      - "source_metadata"
      - "extraction_status"
      - "extraction_provenance"
      - "event"
      - "generated_at_utc"
    properties:
      schema_version: {logical_type: "string", nullable: false, expected_value: "1.0.0"}
      extraction_version: {logical_type: "string", nullable: false}
      taxonomy_version: {logical_type: "string", nullable: false, expected_value: "1.0.0"}
      document_id: {logical_type: "string", nullable: false}
      source_metadata: {logical_type: "json_object", nullable: false, schema_ref: "source_metadata"}
      extraction_status: {logical_type: "enum", nullable: false, enum_ref: "extraction_status"}
      extraction_provenance: {logical_type: "json_object", nullable: false, schema_ref: "extraction_provenance"}
      event: {logical_type: "json_object", nullable: false, schema_ref: "macro_event"}
      generated_at_utc: {logical_type: "utc_datetime_string", nullable: false}

  source_metadata:
    required_properties:
      - "source_id"
      - "disclosure_date"
      - "disclosure_time"
      - "issuer_code"
      - "issuer_name"
      - "title"
      - "document_url"
      - "document_type"
      - "issuer_value_chains"
      - "issuer_value_chain_raw"
    properties:
      source_id: {logical_type: "string", nullable: false}
      disclosure_date: {logical_type: "date_string", nullable: false}
      disclosure_time: {logical_type: "time_string", nullable: true}
      issuer_code: {logical_type: "string", nullable: false}
      issuer_name: {logical_type: "string", nullable: false}
      title: {logical_type: "string", nullable: false}
      document_url: {logical_type: "uri_string", nullable: false}
      document_type: {logical_type: "enum", nullable: false, enum_ref: "document_type"}
      issuer_value_chains:
        logical_type: "enum_array"
        nullable: true
        item_enum_ref: "value_chain"
        description: "Issuer-level classification from maintained configuration or explicit source evidence; never inferred by the LLM without such support."
      issuer_value_chain_raw:
        logical_type: "string_array"
        nullable: true
        description: "Raw issuer classification labels aligned with the configured or source-supported issuer classification."

  input_versions:
    required_properties:
      - "preprocessing_contract_reference"
      - "preprocessing_artifact_hashes"
      - "generic_enrichment_schema_version"
      - "generic_enrichment_version"
    properties:
      preprocessing_contract_reference:
        logical_type: "string"
        nullable: false
        expected_prefix: "020_prop_candidates/notebook/tdnet_pdf_preprocessing.py"
        description: "Code contract reference; append source revision or content hash when available."
      preprocessing_artifact_hashes:
        logical_type: "json_object"
        nullable: false
        description: "Map from consumed preprocessing artifact path or logical artifact name to its content hash."
      generic_enrichment_schema_version: {logical_type: "string", nullable: false}
      generic_enrichment_version: {logical_type: "string", nullable: false}

  extraction_provenance:
    required_properties:
      - "llm_called"
      - "provider"
      - "model"
      - "model_version"
      - "prompt_version"
      - "context_set_version"
      - "temperature"
      - "attempt_count"
      - "fallback_used"
      - "token_usage"
      - "input_evidence_ids"
      - "context_hashes"
      - "latency_ms"
      - "cost"
    properties:
      llm_called: {logical_type: "boolean", nullable: false}
      provider: {logical_type: "string", nullable: true}
      model: {logical_type: "string", nullable: true}
      model_version: {logical_type: "string", nullable: true}
      prompt_version: {logical_type: "string", nullable: false}
      context_set_version: {logical_type: "string", nullable: false}
      temperature: {logical_type: "float", nullable: true}
      attempt_count: {logical_type: "integer", nullable: false, constraints: {min_inclusive: 0}}
      fallback_used: {logical_type: "boolean", nullable: false}
      token_usage:
        logical_type: "json_object"
        nullable: true
        properties:
          input_tokens: {logical_type: "integer", nullable: true}
          output_tokens: {logical_type: "integer", nullable: true}
          total_tokens: {logical_type: "integer", nullable: true}
      input_evidence_ids: {logical_type: "string_array", nullable: false}
      context_hashes: {logical_type: "string_array", nullable: false}
      latency_ms: {logical_type: "integer", nullable: true, constraints: {min_inclusive: 0}}
      cost:
        logical_type: "json_object"
        nullable: true
        properties:
          amount: {logical_type: "decimal", nullable: false}
          currency: {logical_type: "string", nullable: false}

  macro_event:
    grain: "one company x one disclosure x one macro_theme_l1/l2 x one business impact"
    required_properties:
      - "event_id"
      - "dedup_key"
      - "macro_theme_l1"
      - "macro_theme_l2"
      - "event_direction"
      - "impact_direction"
      - "impact_strength"
      - "time_horizon"
      - "actual_or_forecast"
      - "impact_scope"
      - "impact_mechanism"
      - "normalized_summary"
      - "financial_impacts"
      - "evidence_refs"
      - "confidence"
      - "needs_human_review"
      - "review_reasons"
    properties:
      event_id:
        logical_type: "string"
        nullable: false
        generation: "evt_ + first 24 lowercase hex characters of SHA-256(document_id + U+001F + canonical_fingerprint)"
      dedup_key:
        logical_type: "string"
        nullable: false
        generation: "dedup_ + first 24 lowercase hex characters of SHA-256(canonical_dedup_fingerprint)"
      macro_theme_l1: {logical_type: "enum", nullable: false, enum_ref: "macro_theme_l1"}
      macro_theme_l2: {logical_type: "enum", nullable: false, enum_ref: "macro_theme_l2_by_l1"}
      event_direction: {logical_type: "enum", nullable: false, enum_ref: "event_direction"}
      impact_direction:
        logical_type: "enum"
        nullable: false
        enum_ref: "impact_direction"
        description: "Overall business effect of this event; distinct from each financial_impact.impact_direction."
      impact_strength: {logical_type: "enum", nullable: false, enum_ref: "impact_strength"}
      time_horizon: {logical_type: "enum", nullable: false, enum_ref: "time_horizon"}
      actual_or_forecast: {logical_type: "enum", nullable: false, enum_ref: "actual_or_forecast"}
      impact_scope: {logical_type: "enum", nullable: false, enum_ref: "impact_scope"}
      impact_mechanism: {logical_type: "enum", nullable: false, enum_ref: "impact_mechanism"}
      normalized_summary: {logical_type: "string", nullable: false}
      semiconductor_value_chain:
        logical_type: "enum"
        nullable: true
        enum_ref: "value_chain"
        description: "Value-chain target of this event, separate from source_metadata.issuer_value_chains."
      semiconductor_value_chain_raw:
        logical_type: "string"
        nullable: true
        description: "Raw source wording for the event-level value-chain target; required when semiconductor_value_chain is other."
      company_segment_raw: {logical_type: "string", nullable: true}
      company_product_raw: {logical_type: "string", nullable: true}
      normalized_segment: {logical_type: "string", nullable: true}
      normalized_product_group: {logical_type: "string", nullable: true}
      device_category: {logical_type: "enum", nullable: true, enum_ref: "device_category"}
      device_category_raw:
        logical_type: "string"
        nullable: true
        description: "Explicit source wording for device_category; required when device_category is other and normally null when device_category is null."
      technology_node: {logical_type: "string", nullable: true}
      end_market: {logical_type: "enum", nullable: true, enum_ref: "end_market"}
      end_market_raw:
        logical_type: "string"
        nullable: true
        description: "Explicit source wording for end_market; required when end_market is other and normally null when end_market is null."
      customer_group: {logical_type: "string", nullable: true}
      region: {logical_type: "enum", nullable: true, enum_ref: "region"}
      region_raw: {logical_type: "string", nullable: true}
      financial_impacts:
        logical_type: "json_array"
        nullable: false
        default: []
        item_schema_ref: "financial_impact"
      evidence_refs:
        logical_type: "json_array"
        nullable: false
        min_items: 1
        max_items: 8
        item_schema_ref: "evidence_ref"
      confidence:
        logical_type: "float"
        nullable: false
        constraints: {min_inclusive: 0.0, max_inclusive: 1.0}
      needs_human_review: {logical_type: "boolean", nullable: false}
      review_reasons: {logical_type: "string_array", nullable: false}

  financial_impact:
    required_properties:
      - "financial_metric"
      - "impact_direction"
      - "amount_value"
      - "amount_unit"
      - "period"
      - "actual_or_forecast"
      - "offsetting_factor"
    properties:
      financial_metric: {logical_type: "enum", nullable: false, enum_ref: "financial_metric"}
      impact_direction: {logical_type: "enum", nullable: false, enum_ref: "impact_direction"}
      amount_value: {logical_type: "decimal", nullable: true}
      amount_unit: {logical_type: "string", nullable: true}
      period: {logical_type: "string", nullable: true}
      actual_or_forecast: {logical_type: "enum", nullable: false, enum_ref: "actual_or_forecast"}
      offsetting_factor: {logical_type: "string", nullable: true}

  evidence_ref:
    required_properties:
      - "evidence_id"
      - "source_type"
      - "source_ids"
      - "page_numbers"
      - "quote"
    properties:
      evidence_id: {logical_type: "string", nullable: false}
      source_type: {logical_type: "enum", nullable: false, enum_ref: "evidence_source_type"}
      source_ids: {logical_type: "string_array", nullable: false, min_items: 1}
      page_numbers: {logical_type: "integer_array", nullable: false, min_items: 1}
      quote: {logical_type: "string", nullable: false, constraints: {min_length: 1, max_length: 2000}}

  warning:
    required_properties: ["code", "message"]
    properties:
      code: {logical_type: "string", nullable: false}
      message: {logical_type: "string", nullable: false}
      event_id: {logical_type: "string", nullable: true}

  validation_error:
    required_properties: ["code", "message", "json_path"]
    properties:
      code: {logical_type: "string", nullable: false}
      message: {logical_type: "string", nullable: false}
      json_path: {logical_type: "string", nullable: false}
      event_id: {logical_type: "string", nullable: true}

  validation_result:
    required_properties: ["status", "errors", "checked_at_utc"]
    properties:
      status: {logical_type: "enum", nullable: false, enum_ref: "validation_status"}
      errors: {logical_type: "json_array", nullable: false, item_schema_ref: "validation_error"}
      checked_at_utc: {logical_type: "utc_datetime_string", nullable: false}

  review_item:
    required_properties:
      - "run_id"
      - "target_date"
      - "review_item_id"
      - "review_item_type"
      - "document_id"
      - "event_id"
      - "review_status"
      - "review_reasons"
      - "confidence"
      - "canonical_json_path"
      - "created_at_utc"
    properties:
      run_id: {logical_type: "string", nullable: false}
      target_date: {logical_type: "string_yyyymmdd", nullable: false}
      review_item_id: {logical_type: "string", nullable: false}
      review_item_type: {logical_type: "enum", nullable: false, enum_ref: "review_item_type"}
      document_id: {logical_type: "string", nullable: false}
      event_id:
        logical_type: "string"
        nullable: true
        description: "Required key; null for document-level review_only items and non-null for event items."
      review_status: {logical_type: "enum", nullable: false, enum_ref: "review_status"}
      review_reasons: {logical_type: "string_array", nullable: false}
      confidence: {logical_type: "float", nullable: true, constraints: {min_inclusive: 0.0, max_inclusive: 1.0}}
      canonical_json_path:
        logical_type: "path_string"
        nullable: true
        description: "May be null for routing-stage document reviews with no canonical output."
      created_at_utc: {logical_type: "utc_datetime_string", nullable: false}
      resolved_at_utc:
        logical_type: "utc_datetime_string"
        nullable: true
        description: "Null while review_status is pending; populated when the review is resolved or dismissed."
      reviewer:
        logical_type: "string"
        nullable: true
        description: "Null while review_status is pending; identifies the reviewer after disposition."
      resolution_note:
        logical_type: "string"
        nullable: true
        description: "Null while review_status is pending; records the disposition rationale when available."

  extraction_report:
    required_properties:
      - "run_id"
      - "schema_version"
      - "extraction_version"
      - "taxonomy_version"
      - "started_at_utc"
      - "finished_at_utc"
      - "input_document_count"
      - "canonical_document_count"
      - "processed_document_count"
      - "success_document_count"
      - "no_event_document_count"
      - "needs_review_document_count"
      - "failed_validation_document_count"
      - "runtime_failed_document_count"
      - "skipped_document_count"
      - "review_only_document_count"
      - "failed_precheck_document_count"
      - "event_count"
      - "review_item_count"
      - "review_event_count"
      - "status_counts"
      - "macro_theme_l1_counts"
      - "error_code_counts"
      - "output_paths"
    properties:
      run_id: {logical_type: "string", nullable: false}
      schema_version: {logical_type: "string", nullable: false, expected_value: "1.0.0"}
      extraction_version: {logical_type: "string", nullable: false}
      taxonomy_version: {logical_type: "string", nullable: false, expected_value: "1.0.0"}
      started_at_utc: {logical_type: "utc_datetime_string", nullable: false}
      finished_at_utc: {logical_type: "utc_datetime_string", nullable: false}
      input_document_count: {logical_type: "integer", nullable: false, constraints: {min_inclusive: 0}}
      canonical_document_count: {logical_type: "integer", nullable: false, constraints: {min_inclusive: 0}}
      processed_document_count: {logical_type: "integer", nullable: false, constraints: {min_inclusive: 0}}
      success_document_count: {logical_type: "integer", nullable: false, constraints: {min_inclusive: 0}}
      no_event_document_count: {logical_type: "integer", nullable: false, constraints: {min_inclusive: 0}}
      needs_review_document_count: {logical_type: "integer", nullable: false, constraints: {min_inclusive: 0}}
      failed_validation_document_count: {logical_type: "integer", nullable: false, constraints: {min_inclusive: 0}}
      runtime_failed_document_count: {logical_type: "integer", nullable: false, constraints: {min_inclusive: 0}}
      skipped_document_count: {logical_type: "integer", nullable: false, constraints: {min_inclusive: 0}}
      review_only_document_count: {logical_type: "integer", nullable: false, constraints: {min_inclusive: 0}}
      failed_precheck_document_count: {logical_type: "integer", nullable: false, constraints: {min_inclusive: 0}}
      event_count: {logical_type: "integer", nullable: false, constraints: {min_inclusive: 0}}
      review_item_count: {logical_type: "integer", nullable: false, constraints: {min_inclusive: 0}}
      review_event_count: {logical_type: "integer", nullable: false, constraints: {min_inclusive: 0}}
      status_counts: {logical_type: "json_object", nullable: false}
      macro_theme_l1_counts: {logical_type: "json_object", nullable: false}
      error_code_counts: {logical_type: "json_object", nullable: false}
      output_paths: {logical_type: "json_object", nullable: false}

