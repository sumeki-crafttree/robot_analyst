      - "title"
      - "document_url"
      - "document_type"
      - "event_id"
      - "dedup_key"
      - "macro_theme_l1"
      - "macro_theme_l2"
      - "event_direction"
      - "impact_direction"
      - "impact_strength"
      - "time_horizon"
      - "actual_or_forecast"
      - "impact_scope"
      - "impact_mechanism"
      - "normalized_summary"
      - "semiconductor_value_chain"
      - "semiconductor_value_chain_raw"
      - "company_segment_raw"
      - "company_product_raw"
      - "normalized_segment"
      - "normalized_product_group"
      - "device_category"
