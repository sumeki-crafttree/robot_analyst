schema_name: "semiconductor_macro_event_extraction_output"
schema_version: "1.0.0"
status: "design_complete"
owner: "data-pipeline"
component: "semiconductor_macro_event_extraction"
source:
  output_root_dir: "data/processed/tdnet_semiconductor_macro_events_extracted/"
  description: "Evidence-grounded semiconductor macro events extracted from generic TDnet evidence."

common_versions:
  schema_version:
    expected_value: "1.0.0"
    semantics: "Semantic version of this output contract."
  extraction_version:
    format: "YYYY-MM-DD.NNN"
    semantics: "Version of extraction logic, prompt, normalization, and thresholds."
  taxonomy_version:
    expected_value: "1.0.0"
    format: "SemVer"
    semantics: "Version of taxonomy labels and parent-child mappings."

null_and_other_semantics:
  null: "The source does not state the value, or the field is not applicable."
  other: "The source explicitly states a value that is outside the maintained taxonomy."
  raw_value_rule: "When a normalized taxonomy field is other, preserve the explicit source wording in its corresponding raw field when one exists."

