csv_serialization:
  delimiter: ","
  quote_character: "\""
  line_ending: "LF"
  header_required: true
  null_encoding: ""
  empty_string_encoding: "\"\""
  boolean_encoding: ["true", "false"]
  array_object_encoding: "RFC 8259 compact JSON, UTF-8, object keys in schema order, no insignificant whitespace."
  empty_array_encoding: "[]"
  numeric_encoding: "Base-10 JSON number without thousands separators; preserve declared decimal value."
  datetime_encoding: "RFC 3339 UTC with trailing Z."
  ordering: "Rows sorted by document_id ascending, then event_id ascending; summary by source_id; failed by source_id and error_code; review queue by document_id and event_id."

deterministic_identity:
  canonical_fingerprint_fields:
    - "macro_theme_l1"
    - "macro_theme_l2"
    - "event_direction"
    - "impact_direction"
    - "time_horizon"
    - "actual_or_forecast"
    - "impact_scope"
    - "impact_mechanism"
    - "semiconductor_value_chain"
    - "company_segment_raw"
    - "company_product_raw"
    - "normalized_segment"
    - "normalized_product_group"
    - "device_category"
    - "technology_node"
    - "end_market"
    - "customer_group"
    - "region"
    - "financial_impacts"
  canonical_dedup_fingerprint_fields:
    - "issuer_code"
    - "macro_theme_l1"
    - "macro_theme_l2"
    - "event_direction"
    - "impact_scope"
    - "impact_mechanism"
    - "normalized_segment"
    - "normalized_product_group"
    - "device_category"
    - "end_market"
    - "customer_group"
    - "region"
    - "time_horizon"
    - "actual_or_forecast"
  canonical_fingerprint_excluded_fields:
    - "impact_strength"
    - "normalized_summary"
    - "evidence_refs"
    - "confidence"
  impact_strength_identity_rule: "impact_strength is a quality/review attribute intentionally excluded from the canonical fingerprint; reassessing only this label must not change event_id."
  normalization: "NFKC strings; trim; collapse Unicode whitespace; lowercase taxonomy values; null literal; arrays sorted by each object's canonical JSON except evidence_refs sorted by evidence_id; compact JSON with schema-ordered keys."
  collision_rule: "A hash collision is a validation error; never append extraction-order suffixes."

review_policy:
  confidence_threshold: 0.70
  require_review_if:
    - "confidence < 0.70"
    - "event_direction == unclear"
    - "impact_strength == unclear"
    - "actual_or_forecast == unclear"
    - "target scope is evidence-supported but remains ambiguous between two accepted normalizations"
    - "validation warning is configured as reviewable"
  rejection_rule: "Unresolved evidence and unsupported entities, numbers, directions, targets, or causality are validation errors; the candidate must not become an accepted event or be downgraded to review-only."
  document_review_rule: "Routing-stage document concerns such as low text quality may create a review_item_type=document row with event_id=null and no canonical JSON."
  consistency_rule: "For event items, needs_human_review is true if and only if review_reasons is non-empty, and every such event creates one review_item_type=event queue row."

error_codes:
  runtime:
    - "input_not_found"
    - "invalid_input_json"
    - "input_version_mismatch"
    - "empty_generic_evidence"
    - "provider_error"
    - "model_timeout"
    - "model_response_invalid"
    - "retry_exhausted"
    - "unexpected_error"
  validation:
    - "schema_validation_failed"
    - "taxonomy_parent_mismatch"
    - "evidence_unresolved"
    - "quote_not_found"
    - "page_source_mismatch"
    - "unsupported_entity"
    - "unsupported_number"
    - "unsupported_causality"
    - "event_formation_incomplete"
    - "amount_unit_pair_invalid"
    - "identity_collision"
    - "count_reconciliation_failed"

validation_rules:
  - id: "version_exact_match"
    severity: "error"
    rule: "Every output row/object uses schema_version 1.0.0, taxonomy_version 1.0.0, and a non-empty YYYY-MM-DD.NNN extraction_version matching the run report."
  - id: "input_contract_traceability"
    severity: "error"
    rule: "input_versions uses preprocessing_contract_reference beginning with 020_prop_candidates/notebook/tdnet_pdf_preprocessing.py, non-empty preprocessing_artifact_hashes, and both generic enrichment versions; preprocessing_schema_version is not allowed."
  - id: "issuer_classification_grounding"
    severity: "error"
    rule: "issuer_value_chains and issuer_value_chain_raw may only come from maintained issuer configuration or explicit source evidence; the LLM must not infer or complete issuer classification without that support."
  - id: "llm_provenance_consistency"
    severity: "error"
    rule: "If llm_called=false then provider, model, model_version, temperature, token_usage, and cost are null and attempt_count=0; if llm_called=true then provider, model, prompt_version, context_set_version, and temperature are non-null and attempt_count>=1."
  - id: "l1_l2_parent_match"
    severity: "error"
    rule: "macro_theme_l2 must be a member of macro_theme_l2_by_l1[macro_theme_l1]."
  - id: "event_identity_deterministic"
    severity: "error"
    rule: "event_id must equal the deterministic hash rule and remain unchanged when extraction order, normalized_summary wording, evidence_refs enumeration, or only impact_strength is reassessed; canonical financial_impacts remains part of the fingerprint."
  - id: "dedup_identity_separate"
    severity: "error"
    rule: "dedup_key uses the cross-document canonical_dedup_fingerprint and must not be substituted for event_id."
  - id: "event_grain_unique"
    severity: "error"
    rule: "Within one document, do not emit duplicate events for the same L1/L2 and business impact; multiple financial metrics remain in one event."
  - id: "event_formation"
    severity: "error"
    rule: "Every event has event_direction, business impact_direction, a target scope including company_wide when applicable, an impact mechanism, and at least one resolving evidence_ref."
  - id: "target_evidence"
    severity: "error"
    rule: "Nullable target fields may all be null only for impact_scope company_wide; otherwise evidence must support the selected scope and at least one corresponding target field."
  - id: "normalized_raw_pair"
    severity: "error"
    rule: "If semiconductor_value_chain=other then semiconductor_value_chain_raw must be non-null; if device_category=other then device_category_raw must be non-null; if end_market=other then end_market_raw must be non-null; if region=other then region_raw must be non-null. When device_category or end_market is null, its corresponding raw field is normally null."
  - id: "evidence_nonempty"
    severity: "error"
    rule: "evidence_refs has 1 to 8 items and every quote is non-empty."
  - id: "evidence_resolution"
    severity: "error"
    rule: "Every evidence_id and source_id resolves within the input generic evidence set for the same document."
  - id: "quote_normalized_substring"
    severity: "error"
    rule: "After NFKC, line-ending normalization, and whitespace collapse, quote is an exact substring of the resolved input evidence text."
  - id: "evidence_page_source_match"
    severity: "error"
    rule: "source_type, source_ids, and page_numbers exactly agree with the resolved generic evidence metadata."
  - id: "grounded_claims"
    severity: "error"
    rule: "No entity, number, period, direction, target, or causal relationship may be emitted unless supported by evidence_refs."
  - id: "amount_value_unit_pair"
    severity: "error"
    rule: "amount_value and amount_unit are either both null or both non-null."
  - id: "confidence_range"
    severity: "error"
    rule: "Every event confidence is between 0.0 and 1.0 inclusive."
  - id: "review_threshold"
    severity: "error"
    rule: "Review policy, needs_human_review, review_reasons, event review rows, and document-level review_only rows are mutually consistent; validation errors never become accepted review events."
  - id: "status_event_count"
    severity: "error"
    rule: "no_event_found requires events=[]; success requires one or more events and no review event; needs_review requires an accepted review event or a document/chunk-level warning and review reason, and may have zero or more accepted events; failed_validation requires validation errors."
  - id: "partial_chunk_behavior"
    severity: "error"
    rule: "partial is not an extraction_status; a chunk-level partial failure uses needs_review with a warning and review reason, preserving only accepted events from successfully validated chunks."
  - id: "summary_totality"
    severity: "error"
    rule: "Every routed input creates exactly one summary row, including inputs with skipped, review_only, failed_precheck, failed, and canonical extraction statuses; skipped, review_only, and failed_precheck may have no canonical JSON."
  - id: "runtime_failure_behavior"
    severity: "error"
    rule: "Runtime failures create no canonical JSON and no main event rows; they create exactly one summary failed row and at least one failed row."
  - id: "canonical_projection"
    severity: "error"
    rule: "JSONL and CSV event rows are deterministic projections of the same canonical events without re-running extraction; each JSONL line is the declared lossless envelope with native arrays/objects, one line per event and zero lines for documents without events, while CSV is its flat projection."
  - id: "lossless_financial_projection"
    severity: "error"
    rule: "financial_impacts_json reconstructs canonical financial_impacts exactly; convenience columns are populated only for exactly one item and are all null otherwise."
  - id: "csv_json_fields"
    severity: "error"
    rule: "All array/object CSV fields use csv_serialization.array_object_encoding; null is empty, empty arrays are [], and literal empty strings are quoted."
  - id: "csv_column_order"
    severity: "error"
    rule: "Every CSV header exactly follows its table column_order."
  - id: "error_object_integrity"
    severity: "error"
    rule: "Each failed row has a declared error_code, stage, retryable flag, and corresponding summary status/error."
  - id: "report_count_reconciliation"
    severity: "error"
    rule: "input_document_count = processed_document_count + runtime_failed_document_count + skipped_document_count + review_only_document_count + failed_precheck_document_count; canonical_document_count = processed_document_count; processed_document_count equals all four canonical status counts; event_count equals projectable canonical events from success/needs_review documents and main rows, excluding failed_validation candidates; review_item_count equals all review queue rows; review_event_count equals accepted needs_human_review events and review_item_type=event rows."
  - id: "daily_run_aggregate_equivalence"
    severity: "error"
    rule: "Run-level aggregate artifacts equal the deterministic union of included daily artifacts after duplicate primary-key rejection."
