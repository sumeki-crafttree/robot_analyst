    projection_rules:
      financial_impacts_json: "Canonical compact JSON encoding of the complete financial_impacts array; [] when empty."
      convenience_financial_columns: "Populate all seven convenience columns only when financial_impacts has exactly one item; otherwise all seven are null."
      evidence_refs_json: "Canonical compact JSON encoding of complete evidence_refs."
      evidence_ids_json: "Canonical compact JSON encoding of evidence_id values in evidence_refs order."
