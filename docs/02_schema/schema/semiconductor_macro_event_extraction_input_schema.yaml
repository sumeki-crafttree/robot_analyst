schema_name: "semiconductor_macro_event_extraction_input"
schema_version: "1.0.0"
status: "design_complete"
owner: "data-pipeline"
component: "semiconductor_macro_event_extraction_input"
description: "Input contract for selecting generic TDnet enrichments and resolving source evidence for semiconductor macro-event extraction."

contract_boundary:
  producer_repositories:
    generic_enrichment: "021"
    pdf_preprocessing: "020_prop_candidates"
  dependency_type: "file_contract_only"
  imports_020_code: false
  modifies_020_code_or_artifacts: false
  assumptions:
    - "The consumer reads producer artifacts through logical URIs and a configured resolver."
    - "Remote and local storage are equivalent contract locations; no common filesystem root or relative co-location is assumed."
    - "020_prop_candidates/notebook/tdnet_pdf_preprocessing.py is authoritative for preprocessing field shapes and emitted enum values."
    - "generic_body_metadata_enrichment output schema version 1.0.0 is the upstream generic contract baseline."

logical_uri_resolution:
  scheme: "artifact"
  uri_template: "artifact://{producer}/{artifact_name}/{document_id_or_scope}"
  examples:
    - "artifact://generic/daily_main_csv/20260722"
    - "artifact://generic/document_detail/20260722_6753_a1b2c3d4"
    - "artifact://preprocessing/document_blocks/20260722_6753_a1b2c3d4"
  resolver_interface:
    required_operations:
      - "resolve(logical_uri) -> resolved_resource"
      - "exists(logical_uri) -> boolean"
      - "open_text(logical_uri, encoding) -> text_stream"
    resolved_resource_required_properties:
      - "logical_uri"
      - "access_uri"
      - "storage_kind"
    storage_kind_allowed_values:
      - "local"
      - "remote"
    access_uri_examples:
      local: "file:///mounted/generic/20260722/documents/{document_id}/generic_body_metadata_enrichment.json"
      remote: "s3://bucket/generic/20260722/documents/{document_id}/generic_body_metadata_enrichment.json"
  rules:
    - "Persist logical_uri, not machine-specific absolute paths, in extraction lineage."
    - "Never derive a preprocessing URI by replacing path segments in a generic URI."
    - "Resolve every artifact independently by producer, artifact_name, and document_id or scope."
    - "Remote objects may be streamed or cached locally, but content validation is identical."
    - "Resolver ambiguity, zero matches, authorization failure, and integrity failure are explicit precheck errors."

input_artifacts:
  - artifact_name: "generic_main_csv"
    producer: "generic"
    required: true
    requirement: "At least one daily_main_csv or all_main_csv must be supplied; if both contain document_id, rows must be identical for contract fields."
    format: "csv"
    encoding:
      accepted:
        - "utf-8-sig"
        - "utf-8"
    variants:
      - name: "daily_main_csv"
        logical_uri_template: "artifact://generic/daily_main_csv/{yyyymmdd}"
        producer_path_pattern: "{yyyymmdd}/generic_body_enriched_disclosure_metadata.csv"
      - name: "all_main_csv"
        logical_uri_template: "artifact://generic/all_main_csv/{run_id}"
        producer_path_pattern: "generic_body_enriched_disclosure_metadata_all.csv"
    grain: "one_row_per_document"
    role: "index_and_selection_projection"
    canonical: false

  - artifact_name: "generic_document_detail_json"
    producer: "generic"
    required: true
    format: "json"
    logical_uri_template: "artifact://generic/document_detail/{document_id}"
    producer_path_pattern: "{yyyymmdd}/documents/{document_id}/generic_body_metadata_enrichment.json"
    grain: "one_file_per_document"
    role: "canonical_generic_classification_and_evidence"
    canonical: true

  - artifact_name: "document_blocks_jsonl"
    producer: "preprocessing"
    required: true
    format: "jsonl"
    logical_uri_template: "artifact://preprocessing/document_blocks/{document_id}"
    producer_path_pattern: "{yyyymmdd}/documents/{document_id}/document_blocks.jsonl"
    grain: "one_row_per_text_block"
    role: "canonical_block_source_for_generic_evidence"

  - artifact_name: "processing_report_json"
    producer: "preprocessing"
    required: true
    format: "json"
    logical_uri_template: "artifact://preprocessing/processing_report/{document_id}"
    producer_path_pattern: "{yyyymmdd}/documents/{document_id}/processing_report.json"
    grain: "one_file_per_document"
    role: "preprocessing_status_quality_and_page_bounds"
    failure_note: "The current 020 implementation writes this report only after successful extraction. If preprocessing raises before report creation, the report may be absent; absence is missing_processing_report, not processing_status=failed."

  - artifact_name: "document_tables_jsonl"
    producer: "preprocessing"
    required: "conditional"
    requirement: "Required if any selected generic evidence source_ids resolves to a table_id or source_type is table or mixed."
    format: "jsonl"
    logical_uri_template: "artifact://preprocessing/document_tables/{document_id}"
    producer_path_pattern: "{yyyymmdd}/documents/{document_id}/document_tables.jsonl"
    grain: "one_row_per_table"
    role: "canonical_table_source_for_generic_evidence"
    missing_behavior: "Fail precheck only when referenced by generic evidence; otherwise continue."

  - artifact_name: "normalized_markdown"
    producer: "preprocessing"
    required: false
    format: "markdown_with_yaml_like_front_matter"
    logical_uri_template: "artifact://preprocessing/normalized_markdown/{document_id}"
    producer_path_pattern: "{yyyymmdd}/documents/{document_id}/normalized.md"
    grain: "one_file_per_document"
    role: "audit_and_operator_assistance_only"
    usage_constraints:
      - "Do not use as canonical evidence when block/table source_ids are available."
      - "Do not send the full file to an LLM."
      - "Read only bounded excerpts for manual audit or resolver troubleshooting."

  - artifact_name: "candidate_evidence_spans_jsonl"
    producer: "preprocessing"
    required: false
    format: "jsonl"
    logical_uri_template: "artifact://preprocessing/candidate_evidence_spans/{document_id}"
    producer_path_pattern: "{yyyymmdd}/documents/{document_id}/candidate_evidence_spans.jsonl"
    grain: "one_row_per_legacy_evidence_span"
    usage: "ignored"
    prohibition: "Must not affect selection, evidence resolution, confidence, prompt construction, or extraction output."

csv_parsing:
  trim_header_whitespace: true
  preserve_string_fields:
    - "document_id"
    - "source_id"
    - "issuer_code"
  null_tokens:
    nullable_fields_only:
      - ""
    prohibited_for_non_nullable_fields:
      - ""
      - "null"
      - "None"
      - "NaN"
  json_array_string:
    fields:
      - "topic_tags"
      - "business_event_types"
      - "financial_impact_types"
      - "evidence_ids"
      - "warning_codes"
      - "validation_errors"
    parse_rule: "Apply JSON parsing exactly once; the cell must decode to an array. Do not parse Python repr, comma-split text, scalar JSON, or JSON null."
    empty_rule: "The only empty collection representation is []. Empty string and null are invalid."
    item_rule: "Each item must be a string; preserve array order, reject null and non-string items."
  boolean:
    fields:
      - "quantitative_data_present"
      - "needs_structured_extraction"
    producer_contract: "The current Python generic CSV projection serializes booleans as case-sensitive True and False text; these literals are the known producer contract baseline."
    accepted_literals:
      true: "True"
      false: "False"
    parse_rule: "After surrounding-whitespace trim, accept case-sensitive True or False only; reject 1, 0, yes, no, TRUE, FALSE, empty, and null."

tables:
  - table_name: "generic_main_input"
    source_artifact: "generic_main_csv"
    grain: "one_row_per_document"
    primary_key:
      - "document_id"
    required_columns:
      - "schema_version"
      - "enrichment_version"
      - "enrichment_method"
      - "document_id"
      - "source_id"
      - "disclosure_date"
      - "disclosure_time"
      - "issuer_code"
      - "issuer_name"
      - "title"
      - "document_url"
      - "status"
      - "document_type"
      - "topic_tags"
      - "business_event_types"
      - "financial_impact_types"
      - "impact_direction"
      - "actual_or_forecast"
      - "time_horizon"
      - "quantitative_data_present"
      - "body_confidence"
      - "evidence_ids"
      - "evidence_preview"
      - "classification_reason"
      - "text_extraction_quality"
      - "downstream_priority"
      - "needs_structured_extraction"
      - "candidate_stage"
      - "review_hint"
      - "warning_codes"
      - "validation_errors"
      - "generated_at_utc"
    columns:
      - {name: "schema_version", logical_type: "string", nullable: false}
      - {name: "enrichment_version", logical_type: "string", nullable: false}
      - {name: "enrichment_method", logical_type: "string", nullable: false, expected_value: "rule_based"}
      - {name: "document_id", logical_type: "string", nullable: false}
      - {name: "source_id", logical_type: "string", nullable: false}
      - {name: "disclosure_date", logical_type: "date_string", nullable: false, accepted_formats: ["YYYY-MM-DD", "YYYYMMDD"], consumer_normalization: "Normalize to YYYYMMDD for date partitioning and comparison while preserving the producer value in source lineage."}
      - {name: "disclosure_time", logical_type: "time_string", nullable: true, accepted_formats: ["HH:MM", "HH:MM:SS"]}
      - {name: "issuer_code", logical_type: "string", nullable: false}
      - {name: "issuer_name", logical_type: "string", nullable: false}
      - {name: "title", logical_type: "string", nullable: false}
      - {name: "document_url", logical_type: "uri_string", nullable: false}
      - {name: "status", logical_type: "enum", nullable: false, enum_ref: "generic_status"}
      - {name: "document_type", logical_type: "enum", nullable: false, enum_ref: "document_type"}
      - {name: "topic_tags", logical_type: "json_array_string", nullable: false, item_enum_ref: "topic_tag"}
      - {name: "business_event_types", logical_type: "json_array_string", nullable: false, item_enum_ref: "business_event_type"}
      - {name: "financial_impact_types", logical_type: "json_array_string", nullable: false, item_enum_ref: "financial_impact_type"}
      - {name: "impact_direction", logical_type: "enum", nullable: false, enum_ref: "impact_direction"}
      - {name: "actual_or_forecast", logical_type: "enum", nullable: false, enum_ref: "actual_or_forecast"}
      - {name: "time_horizon", logical_type: "enum", nullable: false, enum_ref: "time_horizon"}
      - {name: "quantitative_data_present", logical_type: "boolean", nullable: false}
      - {name: "body_confidence", logical_type: "float", nullable: false, constraints: {min_inclusive: 0.0, max_inclusive: 1.0}}
      - {name: "evidence_ids", logical_type: "json_array_string", nullable: false, constraints: {max_items: 5}}
      - {name: "evidence_preview", logical_type: "string", nullable: true, constraints: {max_length: 300}}
      - {name: "classification_reason", logical_type: "string", nullable: false}
      - {name: "text_extraction_quality", logical_type: "enum", nullable: false, enum_ref: "text_extraction_quality"}
      - {name: "downstream_priority", logical_type: "enum", nullable: false, enum_ref: "downstream_priority"}
      - {name: "needs_structured_extraction", logical_type: "boolean", nullable: false}
      - {name: "candidate_stage", logical_type: "enum", nullable: false, enum_ref: "candidate_stage"}
      - {name: "review_hint", logical_type: "string", nullable: true}
      - {name: "warning_codes", logical_type: "json_array_string", nullable: false}
      - {name: "validation_errors", logical_type: "json_array_string", nullable: false}
      - {name: "generated_at_utc", logical_type: "utc_datetime_string", nullable: false}

  - table_name: "document_blocks_input"
    source_artifact: "document_blocks_jsonl"
    grain: "one_row_per_text_block"
    primary_key:
      - "block_id"
    required_columns:
      - "block_id"
      - "document_id"
      - "page_number"
      - "page_layout_type"
      - "block_order"
      - "block_type"
      - "text"
      - "normalized_text"
      - "char_count"
      - "bbox"
      - "extraction_method"
      - "quality_score"
    columns:
      - {name: "block_id", logical_type: "string", nullable: false}
      - {name: "document_id", logical_type: "string", nullable: false}
      - {name: "page_number", logical_type: "integer", nullable: false, constraints: {min_inclusive: 1}}
      - name: "page_layout_type"
        logical_type: "enum"
        nullable: false
        allowed_values: ["doc_like", "slide_like", "table_heavy", "scanned_or_image"]
        compatibility_note: "These are the values emitted per page by the referenced 020 implementation. Unknown future values must fail version compatibility precheck; mixed is a document-level pdf_layout_type and is not a current block value."
      - {name: "block_order", logical_type: "integer", nullable: false, constraints: {min_inclusive: 1}}
      - name: "block_type"
        logical_type: "enum"
        nullable: false
        allowed_values: ["document_title", "page_title", "section_heading", "bullet", "note", "paragraph", "header", "footer", "unknown"]
        compatibility_note: "These are the values emitted by _guess_block_type plus repeated header/footer tagging. Unknown future values require an explicit compatible schema update."
      - {name: "text", logical_type: "string", nullable: false, constraints: {min_length: 1}}
      - {name: "normalized_text", logical_type: "string", nullable: false}
      - {name: "char_count", logical_type: "integer", nullable: false, constraints: {min_inclusive: 0}}
      - {name: "bbox", logical_type: "number_array", nullable: false, constraints: {exact_length: 4}}
      - {name: "extraction_method", logical_type: "string", nullable: false, expected_value: "pymupdf_text"}
      - {name: "quality_score", logical_type: "float", nullable: false, constraints: {min_inclusive: 0.0, max_inclusive: 1.0}}

  - table_name: "document_tables_input"
    source_artifact: "document_tables_jsonl"
    grain: "one_row_per_table"
    primary_key:
      - "table_id"
    required_columns:
      - "table_id"
      - "document_id"
      - "page_number"
      - "page_layout_type"
      - "table_order"
      - "markdown_table"
      - "raw_cells_json"
      - "extraction_method"
      - "quality_score"
    columns:
      - {name: "table_id", logical_type: "string", nullable: false}
      - {name: "document_id", logical_type: "string", nullable: false}
      - {name: "page_number", logical_type: "integer", nullable: false, constraints: {min_inclusive: 1}}
      - name: "page_layout_type"
        logical_type: "enum"
        nullable: false
        allowed_values: ["doc_like", "slide_like", "table_heavy", "scanned_or_image"]
        compatibility_note: "Current 020 tables inherit the page-level value; unknown future values require compatibility review."
      - {name: "table_order", logical_type: "integer", nullable: false, constraints: {min_inclusive: 1}}
      - {name: "markdown_table", logical_type: "string", nullable: false}
      - {name: "raw_cells_json", logical_type: "array_of_string_arrays", nullable: false}
      - {name: "extraction_method", logical_type: "string", nullable: false, expected_value: "pdfplumber_table"}
      - {name: "quality_score", logical_type: "float", nullable: false, constraints: {min_inclusive: 0.0, max_inclusive: 1.0}}

objects:
  - object_name: "generic_document_detail"
    source_artifact: "generic_document_detail_json"
    primary_key:
      - "document_id"
    required_properties:
      - "schema_version"
      - "enrichment_version"
      - "enrichment_method"
      - "document_id"
      - "source_metadata"
      - "classification"
      - "evidence"
      - "signals"
      - "routing"
      - "quality"
      - "validation"
      - "generated_at_utc"
    properties:
      - {name: "schema_version", logical_type: "string", nullable: false}
      - {name: "enrichment_version", logical_type: "string", nullable: false}
      - {name: "enrichment_method", logical_type: "string", nullable: false, expected_value: "rule_based"}
      - {name: "document_id", logical_type: "string", nullable: false}
      - {name: "source_metadata", logical_type: "json_object", nullable: false, object_schema_ref: "generic_source_metadata"}
      - {name: "classification", logical_type: "json_object", nullable: false, object_schema_ref: "generic_classification"}
      - {name: "evidence", logical_type: "json_array", nullable: false, item_schema_ref: "generic_evidence", constraints: {max_items: 20}}
      - {name: "signals", logical_type: "json_object", nullable: false, object_schema_ref: "generic_signals"}
      - {name: "routing", logical_type: "json_object", nullable: false, object_schema_ref: "generic_routing"}
      - {name: "quality", logical_type: "json_object", nullable: false, object_schema_ref: "generic_quality"}
      - {name: "validation", logical_type: "json_object", nullable: false, object_schema_ref: "generic_validation"}
      - {name: "generated_at_utc", logical_type: "utc_datetime_string", nullable: false}

  - object_name: "generic_source_metadata"
    required_properties: ["source_id", "disclosure_date", "disclosure_time", "issuer_code", "issuer_name", "title", "document_url"]
    properties:
      - {name: "source_id", logical_type: "string", nullable: false}
      - {name: "disclosure_date", logical_type: "date_string", nullable: false}
      - {name: "disclosure_time", logical_type: "time_string", nullable: true}
      - {name: "issuer_code", logical_type: "string", nullable: false}
      - {name: "issuer_name", logical_type: "string", nullable: false}
      - {name: "title", logical_type: "string", nullable: false}
      - {name: "document_url", logical_type: "uri_string", nullable: false}

  - object_name: "generic_classification"
    required_properties: ["document_type", "document_type_candidates", "topic_tags", "business_event_types", "financial_impact_types", "impact_direction", "actual_or_forecast", "time_horizon", "quantitative_data_present", "body_confidence", "classification_reason"]
    properties:
      - {name: "document_type", logical_type: "enum", nullable: false, enum_ref: "document_type"}
      - {name: "document_type_candidates", logical_type: "json_array", nullable: false, item_schema_ref: "document_type_candidate"}
      - {name: "topic_tags", logical_type: "string_array", nullable: false, item_enum_ref: "topic_tag"}
      - {name: "business_event_types", logical_type: "string_array", nullable: false, item_enum_ref: "business_event_type"}
      - {name: "financial_impact_types", logical_type: "string_array", nullable: false, item_enum_ref: "financial_impact_type"}
      - {name: "impact_direction", logical_type: "enum", nullable: false, enum_ref: "impact_direction"}
      - {name: "actual_or_forecast", logical_type: "enum", nullable: false, enum_ref: "actual_or_forecast"}
      - {name: "time_horizon", logical_type: "enum", nullable: false, enum_ref: "time_horizon"}
      - {name: "quantitative_data_present", logical_type: "boolean", nullable: false}
      - {name: "body_confidence", logical_type: "float", nullable: false, constraints: {min_inclusive: 0.0, max_inclusive: 1.0}}
      - {name: "classification_reason", logical_type: "string", nullable: false}

  - object_name: "document_type_candidate"
    required_properties: ["value", "score", "rule_id"]
    properties:
      - {name: "value", logical_type: "enum", nullable: false, enum_ref: "document_type"}
      - {name: "score", logical_type: "integer", nullable: false}
      - {name: "rule_id", logical_type: "string", nullable: false}

  - object_name: "generic_evidence"
    required_properties: ["evidence_id", "source_type", "source_ids", "page_numbers", "matched_rule_ids", "keyword_hits", "text", "quality_score"]
    properties:
      - {name: "evidence_id", logical_type: "string", nullable: false}
      - {name: "source_type", logical_type: "enum", nullable: false, allowed_values: ["block", "table", "mixed"]}
      - {name: "source_ids", logical_type: "string_array", nullable: false, constraints: {min_items: 1}}
      - {name: "page_numbers", logical_type: "integer_array", nullable: false, constraints: {min_items: 1, item_min_inclusive: 1}}
      - {name: "matched_rule_ids", logical_type: "string_array", nullable: false}
      - {name: "keyword_hits", logical_type: "string_array", nullable: false}
      - {name: "text", logical_type: "string", nullable: false, constraints: {min_length: 1, max_length: 2000}}
      - {name: "quality_score", logical_type: "float", nullable: false, constraints: {min_inclusive: 0.0, max_inclusive: 1.0}}

  - object_name: "generic_signals"
    required_properties: ["matched_rule_ids", "title_rule_ids", "negative_rule_ids", "rule_scores", "source_hit_counts", "ambiguous_document_type"]
    properties:
      - {name: "matched_rule_ids", logical_type: "string_array", nullable: false}
      - {name: "title_rule_ids", logical_type: "string_array", nullable: false}
      - {name: "negative_rule_ids", logical_type: "string_array", nullable: false}
      - {name: "rule_scores", logical_type: "object_string_to_integer", nullable: false}
      - {name: "source_hit_counts", logical_type: "json_object", nullable: false, object_schema_ref: "source_hit_counts"}
      - {name: "ambiguous_document_type", logical_type: "boolean", nullable: false}

  - object_name: "source_hit_counts"
    required_properties: ["heading", "body", "table"]
    properties:
      - {name: "heading", logical_type: "integer", nullable: false, constraints: {min_inclusive: 0}}
      - {name: "body", logical_type: "integer", nullable: false, constraints: {min_inclusive: 0}}
      - {name: "table", logical_type: "integer", nullable: false, constraints: {min_inclusive: 0}}

  - object_name: "generic_routing"
    required_properties: ["downstream_priority", "needs_structured_extraction", "candidate_stage", "review_hint"]
    properties:
      - {name: "downstream_priority", logical_type: "enum", nullable: false, enum_ref: "downstream_priority"}
      - {name: "needs_structured_extraction", logical_type: "boolean", nullable: false}
      - {name: "candidate_stage", logical_type: "enum", nullable: false, enum_ref: "candidate_stage"}
      - {name: "review_hint", logical_type: "string", nullable: true}

  - object_name: "generic_quality"
    required_properties: ["text_extraction_quality", "warning_codes"]
    properties:
      - {name: "text_extraction_quality", logical_type: "enum", nullable: false, enum_ref: "text_extraction_quality"}
      - {name: "warning_codes", logical_type: "string_array", nullable: false}

  - object_name: "generic_validation"
    required_properties: ["status", "errors"]
    properties:
      - {name: "status", logical_type: "enum", nullable: false, enum_ref: "generic_status"}
      - {name: "errors", logical_type: "string_array", nullable: false}

  - object_name: "processing_report_input"
    source_artifact: "processing_report_json"
    required_properties: ["document_id", "source_pdf_path", "sha256_hash", "page_count", "pdf_layout_type", "page_layout_summary", "text_char_count", "block_count", "table_count", "evidence_span_count", "document_text_extraction_quality", "used_ocr", "used_vision", "ocr_candidate", "processing_status", "errors", "processed_at_utc"]
    properties:
      - {name: "document_id", logical_type: "string", nullable: false}
      - {name: "source_pdf_path", logical_type: "path_string", nullable: false, usage: "lineage_only_not_for_resolution"}
      - {name: "sha256_hash", logical_type: "hex_string", nullable: false, constraints: {exact_length: 64}}
      - {name: "page_count", logical_type: "integer", nullable: false, constraints: {min_inclusive: 1}}
      - {name: "pdf_layout_type", logical_type: "enum", nullable: false, allowed_values: ["doc_like", "slide_like", "table_heavy", "scanned_or_image", "mixed", "unknown"]}
      - {name: "page_layout_summary", logical_type: "object_enum_to_integer", nullable: false}
      - {name: "text_char_count", logical_type: "integer", nullable: false, constraints: {min_inclusive: 0}}
      - {name: "block_count", logical_type: "integer", nullable: false, constraints: {min_inclusive: 0}}
      - {name: "table_count", logical_type: "integer", nullable: false, constraints: {min_inclusive: 0}}
      - {name: "evidence_span_count", logical_type: "integer", nullable: false, constraints: {min_inclusive: 0}, usage: "observability_only"}
      - {name: "document_text_extraction_quality", logical_type: "enum", nullable: false, enum_ref: "text_extraction_quality"}
      - {name: "used_ocr", logical_type: "boolean", nullable: false, expected_value: false}
      - {name: "used_vision", logical_type: "boolean", nullable: false, expected_value: false}
      - {name: "ocr_candidate", logical_type: "boolean", nullable: false}
      - name: "processing_status"
        logical_type: "enum"
        nullable: false
        allowed_values: ["success", "success_with_warnings"]
        compatibility_note: "The referenced 020 implementation emits only these values. A failed run may leave no processing_report.json."
      - {name: "errors", logical_type: "string_array", nullable: false}
      - {name: "processed_at_utc", logical_type: "utc_datetime_string", nullable: false}

enums:
  generic_status: ["success", "needs_review", "failed_validation"]
  document_type: ["earnings_release", "earnings_presentation", "forecast_revision", "operating_update", "business_plan", "dividend_shareholder_return", "financing_capital_policy", "ma_restructuring", "business_alliance", "capex_fixed_assets", "impairment", "legal_regulatory", "governance_personnel", "sustainability", "other"]
  topic_tag: ["performance", "outlook", "demand_sales", "pricing", "costs", "foreign_exchange", "inventory", "supply_chain", "investment_capacity", "portfolio_change", "partnership", "capital_structure", "shareholder_return", "asset_impairment", "legal_compliance", "governance_organization", "sustainability", "other"]
  business_event_type: ["demand_change", "price_change", "cost_change", "capacity_change", "product_service_change", "market_entry_exit", "acquisition_disposal", "partnership", "restructuring", "supply_disruption", "workforce_change", "other"]
  financial_impact_type: ["revenue", "operating_profit", "ordinary_profit", "net_income", "cash_flow", "assets", "liabilities", "equity", "capex", "dividend", "guidance"]
  impact_direction: ["positive", "negative", "mixed", "neutral", "unclear"]
  actual_or_forecast: ["actual", "forecast", "both", "unclear", "not_applicable"]
  time_horizon: ["immediate", "current_period", "next_period", "medium_term", "multiple", "unclear", "not_applicable"]
  text_extraction_quality: ["high", "medium", "low"]
  downstream_priority: ["high", "medium", "low", "skip"]
  candidate_stage: ["body_supported", "body_weak", "body_unclassified", "needs_review"]
  selection_decision: ["selected", "skipped", "review_only", "failed_precheck"]

routing_configuration:
  object_name: "semiconductor_macro_event_routing"
  fields:
    included_priorities:
      logical_type: "enum_array"
      enum_ref: "downstream_priority"
      default: ["high", "medium"]
      constraints:
        low_is_configurable: true
        skip_is_forbidden: true
    requires_structured_extraction:
      logical_type: "boolean"
      default: true
    allowed_generic_status:
      logical_type: "enum_array"
      enum_ref: "generic_status"
      default: ["success", "needs_review"]
      excluded: ["failed_validation"]
    priority_document_types:
      logical_type: "enum_array"
      enum_ref: "document_type"
      default: ["earnings_release", "earnings_presentation", "forecast_revision", "business_plan", "capex_fixed_assets", "impairment", "ma_restructuring", "business_alliance"]
    low_quality_policy:
      logical_type: "enum"
      allowed_values: ["skip", "review_no_llm"]
      default: "review_no_llm"

selection_decision_table:
  evaluation_order:
    - order: 1
      decision: "failed_precheck"
      when: "A required artifact, schema, version, identity, evidence reference, or page/count integrity check fails."
      llm_allowed: false
    - order: 2
      decision: "skipped"
      when: "generic validation.status is failed_validation."
      llm_allowed: false
    - order: 3
      decision: "skipped"
      when: "routing.needs_structured_extraction is false, unless an explicit operator override sends the item to review_only without LLM."
      llm_allowed: false
    - order: 4
      decision: "review_only"
      when: "text_extraction_quality is low and low_quality_policy is review_no_llm."
      llm_allowed: false
    - order: 5
      decision: "skipped"
      when: "text_extraction_quality is low and low_quality_policy is skip."
      llm_allowed: false
    - order: 6
      decision: "failed_precheck"
      when: "Selected evidence is empty, an evidence source_ids array is empty, or no source_id resolves."
      llm_allowed: false
    - order: 7
      decision: "skipped"
      when: "downstream_priority is not included by included_priorities or document_type is not admitted by configured routing."
      llm_allowed: false
    - order: 8
      decision: "selected"
      when: "All guards pass and at least one generic evidence object resolves completely to blocks/tables."
      llm_allowed: true
  invariants:
    - "failed_validation is never selected."
    - "needs_structured_extraction=false is skipped by default."
    - "Low-quality text is never sent to an LLM."
    - "A selected document must have non-empty canonical evidence."

join_and_evidence_resolution:
  primary_join_key: "document_id"
  source_id_role: "generic metadata lineage only"
  rules:
    - "Join generic CSV to generic detail, blocks, tables, and report by exact document_id."
    - "source_id is not emitted in normalized.md or any other per-document preprocessing artifact produced by the referenced 020 implementation, including document_blocks.jsonl, document_tables.jsonl, processing_report.json, evidence_package.json, and candidate_evidence_spans.jsonl; it must not be expected as a preprocessing join key."
    - "Directory or resolver scope document_id and every artifact-level document_id must match."
    - "For each generic evidence object, resolve every source_ids item to exactly one block_id or table_id of the same document."
    - "source_type=block permits only block_ids; source_type=table permits only table_ids; source_type=mixed requires at least one of each."
    - "document_tables_jsonl becomes required when any table_id is referenced."
    - "The set of pages from resolved sources must equal the evidence page_numbers set."
    - "Every source page must be between 1 and processing_report.page_count."
    - "CSV evidence_ids must resolve to detail evidence; selection uses detail evidence, not evidence_preview."
    - "candidate_evidence_spans.jsonl is never part of this graph."

validation_rules:
  - {id: "missing_generic_main_csv", severity: "error", decision: "failed_precheck", rule: "Neither daily nor all generic main CSV resolves."}
  - {id: "missing_generic_detail", severity: "error", decision: "failed_precheck", rule: "Detail JSON for indexed document_id does not resolve."}
  - {id: "missing_document_blocks", severity: "error", decision: "failed_precheck", rule: "document_blocks.jsonl does not resolve or is empty."}
  - {id: "missing_processing_report", severity: "error", decision: "failed_precheck", rule: "processing_report.json does not resolve, including preprocessing failures that produced no report."}
  - {id: "missing_referenced_document_tables", severity: "error", decision: "failed_precheck", rule: "A generic evidence references a table but document_tables.jsonl does not resolve."}
  - {id: "invalid_csv_header", severity: "error", decision: "failed_precheck", rule: "Any required CSV column is absent or duplicated."}
  - {id: "invalid_csv_json_array", severity: "error", decision: "failed_precheck", rule: "A json_array_string cell violates csv_parsing.json_array_string."}
  - {id: "invalid_csv_boolean", severity: "error", decision: "failed_precheck", rule: "A boolean cell is not exactly True or False."}
  - {id: "duplicate_document_id", severity: "error", decision: "failed_precheck", rule: "document_id is duplicated within an input CSV scope or daily/all variants disagree."}
  - {id: "document_id_mismatch", severity: "error", decision: "failed_precheck", rule: "Any artifact or row document_id differs from the selected document_id."}
  - {id: "csv_detail_projection_mismatch", severity: "error", decision: "failed_precheck", rule: "CSV projection fields differ from their canonical detail JSON counterparts after contract parsing."}
  - {id: "generic_failed_validation", severity: "error", decision: "skipped", rule: "generic validation.status is failed_validation or validation.errors is non-empty."}
  - {id: "preprocessing_status_invalid", severity: "error", decision: "failed_precheck", rule: "processing_status is not success or success_with_warnings."}
  - {id: "preprocessing_count_mismatch", severity: "error", decision: "failed_precheck", rule: "report block_count/table_count differs from parsed files when the corresponding file is supplied."}
  - {id: "empty_generic_evidence", severity: "error", decision: "failed_precheck", rule: "A document otherwise eligible for selection has no generic evidence."}
  - {id: "duplicate_generic_evidence_id", severity: "error", decision: "failed_precheck", rule: "evidence_id is not unique within detail JSON."}
  - {id: "unresolved_generic_evidence_id", severity: "error", decision: "failed_precheck", rule: "A CSV evidence_id does not resolve exactly once in detail JSON."}
  - {id: "empty_evidence_source_ids", severity: "error", decision: "failed_precheck", rule: "A selected evidence source_ids array is empty."}
  - {id: "unresolved_evidence_source_id", severity: "error", decision: "failed_precheck", rule: "A source_id resolves zero or multiple times across blocks/tables."}
  - {id: "evidence_source_type_mismatch", severity: "error", decision: "failed_precheck", rule: "Resolved block/table kinds violate source_type."}
  - {id: "evidence_page_mismatch", severity: "error", decision: "failed_precheck", rule: "Resolved source pages differ from evidence page_numbers."}
  - {id: "page_out_of_range", severity: "error", decision: "failed_precheck", rule: "Any block, table, or evidence page is outside 1..processing_report.page_count."}
  - {id: "low_text_quality_no_llm", severity: "warning", decision: "review_only_or_skipped", rule: "low quality follows low_quality_policy and is never sent to an LLM."}
  - {id: "normalized_markdown_fulltext_forbidden", severity: "error", decision: "failed_precheck", rule: "Prompt construction attempts to include normalized.md in full."}
  - {id: "legacy_evidence_ignored", severity: "info", decision: "none", rule: "candidate_evidence_spans.jsonl has no influence."}
  - {id: "resolver_no_match", severity: "error", decision: "failed_precheck", rule: "A required logical URI resolves to zero resources."}
  - {id: "resolver_ambiguous", severity: "error", decision: "failed_precheck", rule: "A logical URI resolves to multiple resources."}
  - {id: "resolver_access_denied", severity: "error", decision: "failed_precheck", rule: "A required remote/local resource cannot be read."}
  - {id: "unsupported_schema_version", severity: "error", decision: "failed_precheck", rule: "A producer schema major version is unsupported."}
  - {id: "unsupported_enum_value", severity: "error", decision: "failed_precheck", rule: "An unknown enum value is encountered without a declared compatibility mapping."}

error_codes:
  retryable:
    - "resolver_access_denied"
    - "resolver_transient_error"
  non_retryable:
    - "missing_generic_main_csv"
    - "missing_generic_detail"
    - "missing_document_blocks"
    - "missing_processing_report"
    - "missing_referenced_document_tables"
    - "invalid_csv_header"
    - "invalid_csv_json_array"
    - "invalid_csv_boolean"
    - "invalid_json"
    - "invalid_jsonl"
    - "duplicate_document_id"
    - "document_id_mismatch"
    - "csv_detail_projection_mismatch"
    - "generic_failed_validation"
    - "preprocessing_status_invalid"
    - "preprocessing_count_mismatch"
    - "empty_generic_evidence"
    - "duplicate_generic_evidence_id"
    - "unresolved_generic_evidence_id"
    - "empty_evidence_source_ids"
    - "unresolved_evidence_source_id"
    - "evidence_source_type_mismatch"
    - "evidence_page_mismatch"
    - "page_out_of_range"
    - "normalized_markdown_fulltext_forbidden"
    - "resolver_no_match"
    - "resolver_ambiguous"
    - "unsupported_schema_version"
    - "unsupported_enum_value"

version_compatibility:
  this_contract:
    semantic_versioning: true
    major: "Removal, type/meaning change, required field/artifact addition, nullable-to-non-nullable change, or incompatible enum change."
    minor: "Backward-compatible optional field/artifact or explicitly tolerated enum addition."
    patch: "Clarification or example that does not alter accepted data."
  generic_schema_version:
    baseline: "1.0.0"
    compatibility_rule: "Accept same major only after validating all required fields, enums, nullability, and projection semantics; never accept a newer version solely by string comparison."
  enrichment_version:
    compatibility_rule: "Record exact value in lineage. A change may alter selection distributions; rerun acceptance metrics even when schema-compatible."
  preprocessing_contract:
    baseline_reference: "020_prop_candidates/notebook/tdnet_pdf_preprocessing.py"
    compatibility_rule: "Field or emitted-enum changes require fixture validation and this contract update. Unknown current/future enum values are rejected unless compatibility_note and mapping explicitly allow them."
  resolver_contract:
    compatibility_rule: "Storage location may change without schema change if logical URI identity and bytes are preserved."
