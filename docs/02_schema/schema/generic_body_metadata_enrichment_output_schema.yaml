schema_name: "generic_body_metadata_enrichment_output"
schema_version: "1.0.0"
status: "implemented"
owner: "data-pipeline"
component: "generic_body_metadata_enrichment"
source:
  script: "notebook/generic_body_metadata_enrichment.py"
  output_root_dir: "data/processed/tdnet_generic_body_metadata_enriched/"
  description: "Document-level generic TDnet body metadata enrichment outputs."

common_versions:
  schema_version:
    expected_value: "1.0.0"
    semantics: "Semantic version of the output data contract."
  enrichment_version:
    format: "YYYY-MM-DD.NNN"
    semantics: "Version of rules, keywords, weights, and thresholds."
  enrichment_method:
    expected_value: "rule_based"

enums:
  processing_status:
    - "success"
    - "needs_review"
    - "failed_validation"
  document_type:
    - "earnings_release"
    - "earnings_presentation"
    - "forecast_revision"
    - "operating_update"
    - "business_plan"
    - "dividend_shareholder_return"
    - "financing_capital_policy"
    - "ma_restructuring"
    - "business_alliance"
    - "capex_fixed_assets"
    - "impairment"
    - "legal_regulatory"
    - "governance_personnel"
    - "sustainability"
    - "other"
  topic_tag:
    - "performance"
    - "outlook"
    - "demand_sales"
    - "pricing"
    - "costs"
    - "foreign_exchange"
    - "inventory"
    - "supply_chain"
    - "investment_capacity"
    - "portfolio_change"
    - "partnership"
    - "capital_structure"
    - "shareholder_return"
    - "asset_impairment"
    - "legal_compliance"
    - "governance_organization"
    - "sustainability"
    - "other"
  business_event_type:
    - "demand_change"
    - "price_change"
    - "cost_change"
    - "capacity_change"
    - "product_service_change"
    - "market_entry_exit"
    - "acquisition_disposal"
    - "partnership"
    - "restructuring"
    - "supply_disruption"
    - "workforce_change"
    - "other"
  financial_impact_type:
    - "revenue"
    - "operating_profit"
    - "ordinary_profit"
    - "net_income"
    - "cash_flow"
    - "assets"
    - "liabilities"
    - "equity"
    - "capex"
    - "dividend"
    - "guidance"
  impact_direction:
    - "positive"
    - "negative"
    - "mixed"
    - "neutral"
    - "unclear"
  actual_or_forecast:
    - "actual"
    - "forecast"
    - "both"
    - "unclear"
    - "not_applicable"
  time_horizon:
    - "immediate"
    - "current_period"
    - "next_period"
    - "medium_term"
    - "multiple"
    - "unclear"
    - "not_applicable"
  downstream_priority:
    - "high"
    - "medium"
    - "low"
    - "skip"
  candidate_stage:
    - "body_supported"
    - "body_weak"
    - "body_unclassified"
    - "needs_review"
  text_extraction_quality:
    - "high"
    - "medium"
    - "low"
  summary_status:
    - "success"
    - "needs_review"
    - "failed"
    - "failed_validation"

output_artifacts:
  - artifact_name: "document_enrichment_json"
    format: "json"
    path_pattern: "{yyyymmdd}/documents/{document_id}/generic_body_metadata_enrichment.json"
    grain: "one_file_per_document"
    description: "Canonical detailed classification, evidence, rules, scores, and routing payload."
  - artifact_name: "daily_enriched_csv"
    format: "csv"
    encoding: "utf-8-sig"
    path_pattern: "{yyyymmdd}/generic_body_enriched_disclosure_metadata.csv"
    grain: "one_row_per_document"
    description: "Daily document-level generic metadata for downstream joins and BI."
  - artifact_name: "daily_summary_csv"
    format: "csv"
    encoding: "utf-8-sig"
    path_pattern: "{yyyymmdd}/enrichment_summary.csv"
    grain: "one_row_per_input_document"
    description: "Daily processing summary including documents that failed before classification."
  - artifact_name: "daily_failed_csv"
    format: "csv"
    encoding: "utf-8-sig"
    path_pattern: "{yyyymmdd}/enrichment_failed.csv"
    grain: "one_row_per_failure"
    description: "Daily machine-readable failures and validation failures."
  - artifact_name: "daily_report_json"
    format: "json"
    path_pattern: "{yyyymmdd}/daily_enrichment_report.json"
    grain: "one_file_per_day"
    description: "Daily counts, distributions, timings, versions, and paths."
  - artifact_name: "all_enriched_csv"
    format: "csv"
    encoding: "utf-8-sig"
    path_pattern: "generic_body_enriched_disclosure_metadata_all.csv"
    grain: "one_row_per_document_in_run"
    description: "Run-level aggregate of main output rows."
  - artifact_name: "all_summary_csv"
    format: "csv"
    encoding: "utf-8-sig"
    path_pattern: "enrichment_summary_all.csv"
    grain: "one_row_per_input_document_in_run"
    description: "Run-level aggregate processing summary."
  - artifact_name: "all_failed_csv"
    format: "csv"
    encoding: "utf-8-sig"
    path_pattern: "enrichment_failed_all.csv"
    grain: "one_row_per_failure_in_run"
    description: "Run-level aggregate failures."
  - artifact_name: "all_report_json"
    format: "json"
    path_pattern: "enrichment_report_all.json"
    grain: "one_file_per_run"
    description: "Run-level counts, distributions, timings, versions, and paths."

tables:
  - table_name: "tdnet_generic_body_enriched_disclosure_metadata"
    source_artifact: "daily_enriched_csv or all_enriched_csv"
    grain: "one_row_per_document"
    canonical_source: "document_enrichment_detail"
    generation_rule: "Deterministic projection of the same document payload; classification must not run separately for CSV."
    primary_key:
      - "document_id"
    columns:
      - name: "schema_version"
        logical_type: "string"
        nullable: false
        expected_value: "1.0.0"
        description: "Output contract version."
      - name: "enrichment_version"
        logical_type: "string"
        nullable: false
        description: "Rule implementation version."
      - name: "enrichment_method"
        logical_type: "string"
        nullable: false
        expected_value: "rule_based"
        description: "Classification method."
      - name: "document_id"
        logical_type: "string"
        nullable: false
        description: "Preprocessing document identifier and primary key."
      - name: "source_id"
        logical_type: "string"
        nullable: false
        description: "TDnet disclosure_number, falling back to document_url."
      - name: "disclosure_date"
        logical_type: "date_string"
        nullable: false
        recommended_physical_type: "date"
      - name: "disclosure_time"
        logical_type: "time_string"
        nullable: true
        recommended_physical_type: "time"
      - name: "issuer_code"
        logical_type: "string"
        nullable: false
      - name: "issuer_name"
        logical_type: "string"
        nullable: false
      - name: "title"
        logical_type: "string"
        nullable: false
      - name: "document_url"
        logical_type: "uri_string"
        nullable: false
      - name: "status"
        logical_type: "enum"
        nullable: false
        enum_ref: "processing_status"
        description: "Classification result status. Runtime failures do not create main rows."
      - name: "document_type"
        logical_type: "enum"
        nullable: false
        enum_ref: "document_type"
        description: "Primary generic disclosure type."
      - name: "topic_tags"
        logical_type: "json_array_string"
        nullable: false
        item_enum_ref: "topic_tag"
      - name: "business_event_types"
        logical_type: "json_array_string"
        nullable: false
        item_enum_ref: "business_event_type"
      - name: "financial_impact_types"
        logical_type: "json_array_string"
        nullable: false
        item_enum_ref: "financial_impact_type"
      - name: "impact_direction"
        logical_type: "enum"
        nullable: false
        enum_ref: "impact_direction"
      - name: "actual_or_forecast"
        logical_type: "enum"
        nullable: false
        enum_ref: "actual_or_forecast"
      - name: "time_horizon"
        logical_type: "enum"
        nullable: false
        enum_ref: "time_horizon"
      - name: "quantitative_data_present"
        logical_type: "boolean"
        nullable: false
      - name: "body_confidence"
        logical_type: "float"
        nullable: false
        constraints:
          min_inclusive: 0.0
          max_inclusive: 1.0
        description: "Heuristic rule-evidence confidence, not a statistical probability."
      - name: "evidence_ids"
        logical_type: "json_array_string"
        nullable: false
        description: "Up to five generic evidence IDs represented as JSON in CSV."
      - name: "evidence_preview"
        logical_type: "string"
        nullable: true
        constraints:
          max_length: 300
        description: "First 300 characters of the highest-ranked evidence text; full evidence remains in detail JSON."
      - name: "classification_reason"
        logical_type: "string"
        nullable: false
        description: "Human-readable deterministic classification reason."
      - name: "text_extraction_quality"
        logical_type: "enum"
        nullable: false
        enum_ref: "text_extraction_quality"
      - name: "downstream_priority"
        logical_type: "enum"
        nullable: false
        enum_ref: "downstream_priority"
      - name: "needs_structured_extraction"
        logical_type: "boolean"
        nullable: false
      - name: "candidate_stage"
        logical_type: "enum"
        nullable: false
        enum_ref: "candidate_stage"
      - name: "review_hint"
        logical_type: "string"
        nullable: true
      - name: "warning_codes"
        logical_type: "json_array_string"
        nullable: false
        description: "Non-fatal input or classification warnings."
      - name: "validation_errors"
        logical_type: "json_array_string"
        nullable: false
        description: "Empty for success/needs_review and non-empty for failed_validation."
      - name: "generated_at_utc"
        logical_type: "utc_datetime_string"
        nullable: false

  - table_name: "tdnet_generic_body_enrichment_summary"
    source_artifact: "daily_summary_csv or all_summary_csv"
    grain: "one_row_per_input_document"
    primary_key:
      - "run_id"
      - "source_id"
    columns:
      - name: "run_id"
        logical_type: "string"
        nullable: false
      - name: "target_date"
        logical_type: "string_yyyymmdd"
        nullable: false
      - name: "source_id"
        logical_type: "string"
        nullable: false
      - name: "document_id"
        logical_type: "string"
        nullable: true
      - name: "status"
        logical_type: "enum"
        nullable: false
        enum_ref: "summary_status"
      - name: "error_code"
        logical_type: "string"
        nullable: true
      - name: "error_message"
        logical_type: "string"
        nullable: true
      - name: "title"
        logical_type: "string"
        nullable: true
      - name: "output_path"
        logical_type: "path_string"
        nullable: true
      - name: "document_type"
        logical_type: "enum"
        nullable: true
        enum_ref: "document_type"
      - name: "downstream_priority"
        logical_type: "enum"
        nullable: true
        enum_ref: "downstream_priority"
      - name: "needs_structured_extraction"
        logical_type: "boolean"
        nullable: false
      - name: "processing_duration_ms"
        logical_type: "integer"
        nullable: true
        constraints:
          min_inclusive: 0
      - name: "schema_version"
        logical_type: "string"
        nullable: false
      - name: "enrichment_version"
        logical_type: "string"
        nullable: false

  - table_name: "tdnet_generic_body_enrichment_failed"
    source_artifact: "daily_failed_csv or all_failed_csv"
    grain: "one_row_per_failure"
    primary_key:
      - "run_id"
      - "source_id"
      - "error_code"
    columns:
      - name: "run_id"
        logical_type: "string"
        nullable: false
      - name: "target_date"
        logical_type: "string_yyyymmdd"
        nullable: false
      - name: "source_id"
        logical_type: "string"
        nullable: false
      - name: "document_id"
        logical_type: "string"
        nullable: true
      - name: "title"
        logical_type: "string"
        nullable: true
      - name: "error_code"
        logical_type: "string"
        nullable: false
      - name: "error_message"
        logical_type: "string"
        nullable: false
      - name: "retryable"
        logical_type: "boolean"
        nullable: false
      - name: "schema_version"
        logical_type: "string"
        nullable: false
      - name: "enrichment_version"
        logical_type: "string"
        nullable: false
      - name: "generated_at_utc"
        logical_type: "utc_datetime_string"
        nullable: false

objects:
  - object_name: "document_enrichment_detail"
    source_artifact: "document_enrichment_json"
    primary_key:
      - "document_id"
    required_properties:
      - "schema_version"
      - "enrichment_version"
      - "enrichment_method"
      - "document_id"
      - "source_metadata"
      - "classification"
      - "evidence"
      - "signals"
      - "routing"
      - "quality"
      - "validation"
      - "generated_at_utc"
    properties:
      - name: "schema_version"
        logical_type: "string"
        nullable: false
      - name: "enrichment_version"
        logical_type: "string"
        nullable: false
      - name: "enrichment_method"
        logical_type: "string"
        nullable: false
      - name: "document_id"
        logical_type: "string"
        nullable: false
      - name: "source_metadata"
        logical_type: "json_object"
        nullable: false
        required_keys:
          - "source_id"
          - "disclosure_date"
          - "issuer_code"
          - "issuer_name"
          - "title"
          - "document_url"
      - name: "classification"
        logical_type: "json_object"
        nullable: false
        required_keys:
          - "document_type"
          - "document_type_candidates"
          - "topic_tags"
          - "business_event_types"
          - "financial_impact_types"
          - "impact_direction"
          - "actual_or_forecast"
          - "time_horizon"
          - "quantitative_data_present"
          - "body_confidence"
          - "classification_reason"
      - name: "evidence"
        logical_type: "json_array"
        nullable: false
        max_items: 20
        item_schema_ref: "generic_evidence"
      - name: "signals"
        logical_type: "json_object"
        nullable: false
        description: "Matched keywords, rule IDs, source-specific hit counts, and negative signals."
      - name: "routing"
        logical_type: "json_object"
        nullable: false
        required_keys:
          - "downstream_priority"
          - "needs_structured_extraction"
          - "candidate_stage"
          - "review_hint"
      - name: "quality"
        logical_type: "json_object"
        nullable: false
        required_keys:
          - "text_extraction_quality"
          - "warning_codes"
      - name: "validation"
        logical_type: "json_object"
        nullable: false
        required_keys:
          - "status"
          - "errors"
      - name: "generated_at_utc"
        logical_type: "utc_datetime_string"
        nullable: false

  - object_name: "generic_evidence"
    grain: "one_object_per_generic_evidence_span"
    required_properties:
      - "evidence_id"
      - "source_type"
      - "source_ids"
      - "page_numbers"
      - "matched_rule_ids"
      - "keyword_hits"
      - "text"
      - "quality_score"
    properties:
      - name: "evidence_id"
        logical_type: "string"
        nullable: false
      - name: "source_type"
        logical_type: "enum"
        nullable: false
        allowed_values:
          - "block"
          - "table"
          - "mixed"
      - name: "source_ids"
        logical_type: "string_array"
        nullable: false
      - name: "page_numbers"
        logical_type: "integer_array"
        nullable: false
      - name: "matched_rule_ids"
        logical_type: "string_array"
        nullable: false
      - name: "keyword_hits"
        logical_type: "string_array"
        nullable: false
      - name: "text"
        logical_type: "string"
        nullable: false
        constraints:
          max_length: 2000
      - name: "quality_score"
        logical_type: "float"
        nullable: false
        constraints:
          min_inclusive: 0.0
          max_inclusive: 1.0

  - object_name: "enrichment_report"
    source_artifact: "daily_report_json or all_report_json"
    required_properties:
      - "run_id"
      - "schema_version"
      - "enrichment_version"
      - "started_at_utc"
      - "finished_at_utc"
      - "input_count"
      - "matched_count"
      - "processed_count"
      - "success_count"
      - "needs_review_count"
      - "failed_validation_count"
      - "failed_count"
      - "document_type_counts"
      - "priority_counts"
      - "text_quality_counts"
      - "error_code_counts"
      - "needs_structured_extraction_count"
      - "output_paths"

validation_rules:
  - id: "main_primary_key"
    severity: "error"
    applies_to: "tdnet_generic_body_enriched_disclosure_metadata"
    rule: "document_id must be non-empty and unique within output scope"
  - id: "version_required"
    severity: "error"
    applies_to: "all outputs"
    rule: "schema_version and enrichment_version must be non-empty"
  - id: "main_enum_values"
    severity: "error"
    applies_to: "tdnet_generic_body_enriched_disclosure_metadata"
    rule: "all enum fields and JSON array enum items must use values declared in this schema"
  - id: "confidence_range"
    severity: "error"
    applies_to: "tdnet_generic_body_enriched_disclosure_metadata.body_confidence"
    rule: "0.0 <= value <= 1.0"
  - id: "high_priority_confidence"
    severity: "error"
    applies_to: "tdnet_generic_body_enriched_disclosure_metadata"
    rule: "if downstream_priority == high then body_confidence >= 0.75 and evidence_ids is non-empty"
  - id: "structured_extraction_guard"
    severity: "error"
    applies_to: "tdnet_generic_body_enriched_disclosure_metadata"
    rule: "if needs_structured_extraction == true then downstream_priority in (high, medium), evidence_ids non-empty, text_extraction_quality != low, and at least one of business_event_types or financial_impact_types non-empty"
  - id: "supported_requires_evidence"
    severity: "error"
    applies_to: "tdnet_generic_body_enriched_disclosure_metadata"
    rule: "if candidate_stage == body_supported then body_confidence >= 0.60 and evidence_ids is non-empty"
  - id: "low_quality_review"
    severity: "error"
    applies_to: "tdnet_generic_body_enriched_disclosure_metadata"
    rule: "if text_extraction_quality == low then candidate_stage == needs_review and needs_structured_extraction == false"
  - id: "failed_validation_errors"
    severity: "error"
    applies_to: "tdnet_generic_body_enriched_disclosure_metadata"
    rule: "status == failed_validation if and only if validation_errors is non-empty"
  - id: "evidence_alignment"
    severity: "error"
    applies_to: "document_enrichment_detail"
    rule: "every CSV evidence_id must resolve to exactly one evidence object in the corresponding detail JSON"
  - id: "evidence_preview_alignment"
    severity: "error"
    applies_to: "tdnet_generic_body_enriched_disclosure_metadata"
    rule: "evidence_preview must be null when evidence_ids is empty; otherwise it must equal the first 300 characters of the highest-ranked evidence text in detail JSON"
  - id: "evidence_id_unique"
    severity: "error"
    applies_to: "generic_evidence"
    rule: "evidence_id must be unique within a document"
  - id: "main_failure_behavior"
    severity: "error"
    applies_to: "pipeline"
    rule: "runtime failures must appear in summary and failed outputs and must not create a main output row"
  - id: "count_reconciliation"
    severity: "error"
    applies_to: "enrichment_report"
    rule: "input_count equals processed_count plus failed_count before classification, with status counts reconciling to processed_count"
